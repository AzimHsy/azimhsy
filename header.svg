<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Azim — Creative Developer</title>
  <desc id="desc">Editorial profile banner with motion-inspired lines and frames</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#7ee787"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#30363d" stroke-width="1" opacity=".42"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="#0d1117"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="1010" cy="85" r="96" fill="#58a6ff" opacity=".08" filter="url(#glow)"/>
  <circle cx="930" cy="274" r="72" fill="#7ee787" opacity=".06" filter="url(#glow)"/>

  <g transform="translate(72 67)">
    <text x="0" y="0" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="4">NUR FITRI AZIM  /  MALAYSIA</text>
    <text x="0" y="77" fill="#f0f6fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="65" font-weight="700" letter-spacing="-2.5">Creative Developer</text>
    <text x="0" y="127" fill="#b1bac4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23">I build websites that move with intent.</text>
    <g transform="translate(0 180)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="2">
      <text x="0" y="0" fill="#58a6ff">MOTION</text>
      <circle cx="91" cy="-5" r="2.5" fill="#484f58"/>
      <text x="111" y="0" fill="#7ee787">INTERACTION</text>
      <circle cx="236" cy="-5" r="2.5" fill="#484f58"/>
      <text x="256" y="0" fill="#d2a8ff">COMMERCE</text>
    </g>
  </g>

  <g fill="none" stroke-linecap="round">
    <rect x="902" y="62" width="166" height="206" rx="18" stroke="#30363d" stroke-width="2" transform="rotate(8 985 165)"/>
    <rect x="863" y="91" width="166" height="206" rx="18" stroke="url(#blue)" stroke-width="2" transform="rotate(-7 946 194)"/>
    <path d="M839 251C895 168 937 139 1004 132c54-6 89 10 136 53" stroke="#58a6ff" stroke-width="3"/>
    <path d="M839 270C907 205 968 190 1043 205 1091 215 1123 239 1153 273" stroke="#7ee787" stroke-width="2" opacity=".75"/>
    <circle cx="839" cy="251" r="6" fill="#58a6ff" stroke="none"/>
    <circle cx="1153" cy="273" r="6" fill="#7ee787" stroke="none"/>
  </g>

  <path d="M72 324H1128" stroke="#30363d"/>
  <text x="1128" y="331" fill="#484f58" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">AZIMHSY / 2026</text>
</svg>
